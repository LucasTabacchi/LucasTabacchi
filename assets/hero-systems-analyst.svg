<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#090d17"/>
    </linearGradient>

    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b111e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="blueprintGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.045"/>
    </pattern>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filter for Cursor Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Outer Terminal Window Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#terminalBg)" stroke="url(#windowBorder)" stroke-width="1.75"/>

  <!-- Blueprint Grid Overlay -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#blueprintGrid)"/>

  <!-- Ambient Glow Effects -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#cyanGlow)"/>
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#purpleGlow)"/>

  <!-- Terminal Title Bar -->
  <path d="M 2 20 Q 2 2 20 2 L 1180 2 Q 1198 2 1198 20 L 1198 44 L 2 44 Z" fill="#0d1527" fill-opacity="0.88"/>
  <line x1="2" y1="44" x2="1198" y2="44" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>

  <!-- macOS Traffic Lights -->
  <circle cx="28" cy="23" r="6.5" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="48" cy="23" r="6.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="68" cy="23" r="6.5" fill="#10b981" filter="url(#glow)"/>

  <!-- Titlebar Terminal Path -->
  <g class="font-mono" font-size="13">
    <text x="105" y="27" fill="#38bdf8" font-weight="600">lucas@systems-analyst</text>
    <text x="270" y="27" fill="#64748b">:</text>
    <text x="282" y="27" fill="#cbd5e1">~/workspace/architecture</text>
  </g>

  <!-- Titlebar Right Status Badge -->
  <g transform="translate(1030, 13)">
    <rect x="0" y="0" width="145" height="22" rx="11" fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="11" r="3.5" fill="#10b981" filter="url(#glow)"/>
    <text x="25" y="15" class="font-mono" font-size="10.5" fill="#38bdf8" font-weight="600" letter-spacing="0.5">SYS_ACTIVE · PROD</text>
  </g>

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->

  <!-- Terminal Command Prompt -->
  <g class="font-mono" font-size="15" transform="translate(48, 86)">
    <text x="0" y="0" fill="#f43f5e" font-weight="700">❯</text>
    <text x="18" y="0" fill="#38bdf8" font-weight="500">whoami</text>
    <text x="76" y="0" fill="#94a3b8">--profile</text>
    <text x="160" y="0" fill="#94a3b8">--verbose</text>
    <rect x="246" y="-13" width="9" height="17" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Hero Name -->
  <text x="48" y="145" class="font-sans" font-size="52" font-weight="800" fill="url(#nameGradient)" letter-spacing="-1">Lucas Tabacchi</text>

  <!-- Role -->
  <text x="48" y="172" class="font-mono" font-size="18" font-weight="600" fill="#38bdf8">Analista en Sistemas de Información</text>

  <!-- Subtitle & Value Proposition -->
  <g class="font-sans" font-size="14.5" fill="#94a3b8" transform="translate(48, 216)">
    <text x="0" y="0">Diseño y desarrollo soluciones <tspan fill="#f1f5f9" font-weight="600">end-to-end</tspan> con especial foco en <tspan fill="#38bdf8" font-weight="600">arquitectura</tspan>,</text>
    <text x="0" y="24">APIs de alta disponibilidad, sistemas distribuidos y productos web &amp; mobile.</text>
  </g>

  <!-- Architectural Pillars Badges -->
  <g class="font-mono" font-size="11.5" transform="translate(48, 275)">
    <!-- Architecture -->
    <rect x="0" y="0" width="132" height="26" rx="6" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="12" y="17" fill="#bae6fd" font-weight="500">🏛️ Arquitectura</text>

    <!-- Backend -->
    <rect x="142" y="0" width="144" height="26" rx="6" fill="#065f46" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
    <text x="154" y="17" fill="#a7f3d0" font-weight="500">⚙️ Backend &amp; APIs</text>

    <!-- Distributed -->
    <rect x="296" y="0" width="168" height="26" rx="6" fill="#581c87" fill-opacity="0.25" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="308" y="17" fill="#e9d5ff" font-weight="500">📨 Sistemas Eventos</text>

    <!-- Cloud & Mobile -->
    <rect x="474" y="0" width="138" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-opacity="0.5" stroke-width="1"/>
    <text x="486" y="17" fill="#cbd5e1" font-weight="500">📱 Web &amp; Mobile</text>
  </g>

  <!-- Live Status & Location Row -->
  <g class="font-mono" transform="translate(48, 345)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#10b981" filter="url(#glow)"/>
    <text x="28" y="19" font-size="12" fill="#4ade80" font-weight="600">status: open_to_work = true</text>

    <!-- Location -->
    <text x="282" y="19" font-size="12.5" fill="#64748b">📍 Entre Ríos, Argentina</text>
  </g>

  <!-- ================= RIGHT COLUMN: TELEMETRY CONSOLE ================= -->
  <g transform="translate(685, 76)">
    <!-- Telemetry Card Box -->
    <rect x="0" y="0" width="465" height="300" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.25"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="465" height="42" rx="14" fill="#0f172a" fill-opacity="0.6"/>
    <line x1="0" y1="42" x2="465" y2="42" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>

    <g class="font-mono" transform="translate(20, 26)">
      <text x="0" y="0" font-size="12.5" fill="#38bdf8" font-weight="600">SELECT * FROM stack_telemetry;</text>
      <!-- Mode Badge -->
      <rect x="330" y="-15" width="95" height="20" rx="4" fill="#7c3aed" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="339" y="-1" font-size="10.5" fill="#d8b4fe" font-weight="600">CLUSTER: OK</text>
    </g>

    <!-- Telemetry Rows -->
    <!-- Row 1: BACKEND -->
    <g class="font-mono" transform="translate(20, 76)">
      <text x="0" y="0" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1">BACKEND</text>
      <!-- Pills -->
      <rect x="90" y="-14" width="70" height="22" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="100" y="1" font-size="11.5" fill="#e0f2fe">Node.js</text>

      <rect x="168" y="-14" width="66" height="22" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="178" y="1" font-size="11.5" fill="#e0f2fe">FastAPI</text>

      <rect x="242" y="-14" width="60" height="22" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="252" y="1" font-size="11.5" fill="#e0f2fe">Django</text>

      <rect x="310" y="-14" width="70" height="22" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="320" y="1" font-size="11.5" fill="#e0f2fe">GraphQL</text>
    </g>

    <!-- Row 2: DISTRIBUTED & CLOUD -->
    <g class="font-mono" transform="translate(20, 118)">
      <text x="0" y="0" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1">SYSTEMS</text>
      <rect x="90" y="-14" width="64" height="22" rx="4" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
      <text x="100" y="1" font-size="11.5" fill="#bae6fd">Docker</text>

      <rect x="162" y="-14" width="98" height="22" rx="4" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
      <text x="172" y="1" font-size="11.5" fill="#bae6fd">Apache Kafka</text>

      <rect x="268" y="-14" width="80" height="22" rx="4" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
      <text x="278" y="1" font-size="11.5" fill="#bae6fd">Redis GEO</text>

      <rect x="356" y="-14" width="46" height="22" rx="4" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
      <text x="366" y="1" font-size="11.5" fill="#bae6fd">AWS</text>
    </g>

    <!-- Row 3: DATA ENGINE -->
    <g class="font-mono" transform="translate(20, 160)">
      <text x="0" y="0" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1">DATA</text>
      <rect x="90" y="-14" width="88" height="22" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
      <text x="100" y="1" font-size="11.5" fill="#dbeafe">PostgreSQL</text>

      <rect x="186" y="-14" width="76" height="22" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
      <text x="196" y="1" font-size="11.5" fill="#dbeafe">MongoDB</text>

      <rect x="270" y="-14" width="56" height="22" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
      <text x="280" y="1" font-size="11.5" fill="#dbeafe">Prisma</text>

      <rect x="334" y="-14" width="78" height="22" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
      <text x="344" y="1" font-size="11.5" fill="#dbeafe">Supabase</text>
    </g>

    <!-- Row 4: CLIENT / MOBILE -->
    <g class="font-mono" transform="translate(20, 202)">
      <text x="0" y="0" font-size="11" fill="#64748b" font-weight="700" letter-spacing="1">CLIENT</text>
      <rect x="90" y="-14" width="66" height="22" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
      <text x="100" y="1" font-size="11.5" fill="#d1fae5">Next.js</text>

      <rect x="164" y="-14" width="102" height="22" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
      <text x="174" y="1" font-size="11.5" fill="#d1fae5">React Native</text>

      <rect x="274" y="-14" width="92" height="22" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
      <text x="284" y="1" font-size="11.5" fill="#d1fae5">TypeScript</text>

      <rect x="374" y="-14" width="50" height="22" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.25" stroke-width="1"/>
      <text x="384" y="1" font-size="11.5" fill="#d1fae5">Expo</text>
    </g>

    <!-- Footer Divider Line -->
    <line x1="0" y1="240" x2="465" y2="240" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Telemetry Footer Details -->
    <g class="font-mono" font-size="11" fill="#64748b" transform="translate(20, 272)">
      <text x="0" y="0">ARCH: <tspan fill="#38bdf8" font-weight="600">Hexagonal · Event-Driven</tspan></text>
      <text x="275" y="0">PIPELINE: <tspan fill="#10b981" font-weight="600">CI/CD Automated</tspan></text>
    </g>
  </g>
</svg>
